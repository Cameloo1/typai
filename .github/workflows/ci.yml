name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test-lint:
    name: Build, Test, Lint, Core Bench
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            cargo install wasm-pack --locked
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Rich adapter conformance and package tests
        run: |
          pnpm --filter @typai/adapter-testkit test
          pnpm --filter @typai/react test
          pnpm --filter @typai/codemirror test

      - name: Remote completion package tests and streaming mocks
        run: |
          pnpm --filter @typai/completion-remote build
          pnpm --filter @typai/completion-remote test

      - name: Lint
        run: pnpm lint

      - name: Core benchmark smoke
        run: pnpm --filter @typai/core bench

      - name: Spell quality benchmark gates
        run: pnpm bench:spell-quality

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            cargo install wasm-pack --locked
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Build
        run: pnpm build

      - name: Playwright Chromium V4.1 surfaces
        run: pnpm exec playwright test tests/e2e/accessibility.spec.ts tests/e2e/simple-demo-editor.spec.ts tests/e2e/remote-completion.spec.ts tests/e2e/textarea-demo.spec.ts tests/e2e/textarea-ghost-feasibility.spec.ts tests/e2e/textarea-ghost-renderer.spec.ts tests/e2e/react-demo.spec.ts tests/e2e/spell-quality-parity.spec.ts tests/e2e/v4-1-completion.spec.ts --project=chromium

      - name: Playwright CodeMirror Chromium
        run: pnpm exec playwright test tests/e2e/codemirror-demo.spec.ts --project=chromium

      - name: Playwright Accessibility Firefox
        run: pnpm exec playwright test tests/e2e/accessibility.spec.ts --project=firefox

      - name: Playwright React and V4.1 Completion Firefox
        run: pnpm exec playwright test tests/e2e/react-demo.spec.ts tests/e2e/v4-1-completion.spec.ts --project=firefox

      - name: Playwright Contenteditable, Remote Completion, Textarea, and Spell Quality Firefox
        run: pnpm exec playwright test tests/e2e/simple-demo-editor.spec.ts tests/e2e/remote-completion.spec.ts tests/e2e/textarea-demo.spec.ts tests/e2e/textarea-ghost-feasibility.spec.ts tests/e2e/textarea-ghost-renderer.spec.ts tests/e2e/spell-quality-parity.spec.ts --project=firefox

      - name: Playwright CodeMirror Firefox
        run: pnpm exec playwright test tests/e2e/codemirror-demo.spec.ts --project=firefox

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  package-smoke:
    name: Package Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            cargo install wasm-pack --locked
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dry-run pack
        run: pnpm pack:dry

      - name: Local install smoke
        run: pnpm smoke:install

      - name: Package secret scan
        run: pnpm scan:package-secrets

  browser-benchmark-smoke:
    name: Browser Benchmark Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            cargo install wasm-pack --locked
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Build
        run: pnpm build

      - name: Browser benchmark smoke (correction and V4.1 completion surfaces)
        run: pnpm bench:browser

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-benchmark-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
