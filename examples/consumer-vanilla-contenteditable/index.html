<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typai contenteditable consumer</title>
  </head>
  <body>
    <main class="page">
      <section class="panel">
        <h1>Contenteditable correction</h1>
        <p>Type a completed word such as <code>teh </code> or <code>recieve </code>.</p>

        <pre id="log" aria-live="polite">Loading typai...</pre>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
